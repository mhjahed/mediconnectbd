{% extends 'base.html' %}
{% block title %}Reset Password — MediConnect{% endblock %}
{% block content %}
<section class="section-pad">
  <div class="container" style="max-width:500px;">
    <div class="neu-card">
      <span class="eyebrow">Account Recovery</span>
      <h1>Reset Password</h1>
      <p style="color:var(--ink-secondary);">Enter your registered email address. If an account exists, a 1-hour password reset link will be dispatched.</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email" class="form-label">Registered Email Address</label>
          <input type="email" name="email" id="id_email" required class="neu-input" placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
