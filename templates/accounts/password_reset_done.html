{% extends 'base.html' %}
{% block title %}Reset Link Sent — MediConnect{% endblock %}
{% block content %}
<section class="section-pad">
  <div class="container" style="max-width:520px;">
    <div class="neu-card">
      <span class="eyebrow">Account Recovery</span>
      <h1>Check Your Email</h1>
      <p style="color:var(--ink-secondary);">If an account matches that email address, we sent a single-use password reset link valid for 60 minutes.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary">Return to Sign In</a>
    </div>
  </div>
</section>
{% endblock %}
